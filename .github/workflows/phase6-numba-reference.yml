name: Phase 6 Numba Reference

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase6-numba-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numba-reference:
    name: ${{ matrix.os }} / Python 3.12.10
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: phase6_numba_reference/requirements.txt

      - name: Install exact P6.3 environment
        run: python -m pip install -r phase6_numba_reference/requirements.txt

      - name: Run P6.3 synthetic/reference tests
        run: python -m unittest discover -s tests/python -p "test_phase6_numba_reference.py" -v
